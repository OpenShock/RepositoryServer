on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    types: [ opened, reopened, synchronize ]
  workflow_call:
    inputs:
      latest:
        description: 'Tag image as latest'
        required: false
        type: boolean
        default: false
      push:
        description: 'Push image to registry (makes it push if it usually wouldnt)'
        required: false
        type: boolean
        default: false
  workflow_dispatch:

name: ci-build

env:
  REGISTRY: ghcr.io
  DOTNET_VERSION: 11.0.x

jobs:

  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: repository-server-tunit
            project: RepositoryServer.Tests/RepositoryServer.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: '${{ env.DOTNET_VERSION }}'

      - name: Run ${{ matrix.name }} tests
        run: |
          set -euo pipefail
          dotnet test -c Release --project ${{ matrix.project }}

  # Each image builds on a runner matching its own architecture (no QEMU) and pushes an untagged
  # image by digest. `merge` then stitches each image's digests into one tagged manifest.
  build:
    name: Build (${{ matrix.image.name }} / ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: repository-server
            dockerfile: docker/RepositoryServer.Dockerfile
        platform:
          - name: linux/amd64
            runner: ubuntu-latest
    env:
      PUSH_IMAGE: ${{ inputs.push || (github.ref_protected && github.event_name != 'pull_request') }}
    outputs:
      push-image: ${{ env.PUSH_IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build ${{ matrix.image.name }}
        uses: ./.github/actions/build-app
        with:
          dockerfile: ${{ matrix.image.dockerfile }}
          image: ${{ matrix.image.name }}
          platform: ${{ matrix.platform.name }}
          push: ${{ env.PUSH_IMAGE }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  # Not a matrix: matrix jobs can't expose a per-entry output, and deploys need this image's digest.
  merge:
    name: Merge (repository-server)
    needs: [build, tests]
    runs-on: ubuntu-latest
    if: needs.build.outputs.push-image == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Merge repository-server
        id: merge
        uses: ./.github/actions/merge-image
        with:
          registry: ${{ env.REGISTRY }}
          image: repository-server
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          latest: ${{ inputs.latest || false }}

  # Deploys pin the manifest digest rather than a tag: no per-build tags are created, and
  # re-running this job alone sends the same digest.
  deploy-prod-workflow:
    runs-on: ubuntu-latest
    needs: merge
    if: ${{ github.ref_type == 'branch' && github.event_name != 'pull_request' && github.ref_name == 'master' }}
    environment: production
    steps:
      - name: Send repository dispatch
        uses: OpenShock/actions/repository-dispatch@21ca2d511bca92cf24fb502fa302f82700822584 # v1.1.1
        with:
          repo: openshock/kubernetes-cluster-gitops
          event-type: update-repository-server-prod
          client-payload: |
            {"digest": "${{ needs.merge.outputs.digest }}"}
          token: ${{ secrets.GITOPS_PAT }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: merge
    if: ${{ github.ref_type == 'branch' && github.event_name != 'pull_request' && github.ref_name == 'develop' }}
    environment: development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github

      - uses: ./.github/actions/watchtower-update
        with:
          url: ${{ vars.WATCHTOWER_URL }}
          token: ${{ secrets.WATCHTOWER_TOKEN }}